name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt pip-audit

      - name: Audit production Node dependencies
        run: npm audit --omit=dev --registry=https://registry.npmjs.org

      - name: Audit Python dependencies
        run: |
          python -m pip_audit -r backend/requirements.txt
          python -m pip_audit -r packaging/python-requirements.lock.txt --no-deps --disable-pip

      - name: Check JavaScript syntax
        run: npm run check:js

      - name: Check Python syntax
        run: npm run check:python

      - name: Run regression tests
        run: npm test

      - name: Audit public files
        shell: powershell
        run: npm run audit:open-source
