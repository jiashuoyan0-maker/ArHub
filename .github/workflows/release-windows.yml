name: Signed Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: [self-hosted, Windows, X64, arhub-release]
    timeout-minutes: 360
    environment: windows-release
    env:
      GH_TOKEN: ${{ github.token }}
      ARHUB_PUBLISHER_NAME: ${{ secrets.ARHUB_PUBLISHER_NAME }}
      ARHUB_SIGNING_PROVIDER: ${{ vars.ARHUB_SIGNING_PROVIDER || 'pfx' }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}

    steps:
      - name: Resolve release tag
        id: release
        shell: powershell
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+([+-].+)?$') { throw "Invalid release tag: $tag" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify tag matches package version
        shell: powershell
        run: |
          $version = (Get-Content package.json -Encoding utf8 | ConvertFrom-Json).version
          if ('${{ steps.release.outputs.tag }}' -ne "v$version") { throw "Tag must be v$version" }

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r backend/requirements.txt
          python -m pip install pip-audit

      - name: Run quality gates
        run: |
          npm audit --omit=dev --registry=https://registry.npmjs.org
          python -m pip_audit -r backend/requirements.txt
          python -m pip_audit -r packaging/python-requirements.lock.txt --no-deps --disable-pip
          npm run check:js
          npm run check:python
          npm test
          npm run audit:open-source

      - name: Download locked runtime bundle
        shell: powershell
        run: |
          $manifest = Get-Content packaging/runtime-manifest.json -Encoding utf8 | ConvertFrom-Json
          New-Item -ItemType Directory -Path .runtime/bundle -Force | Out-Null
          gh release download "runtime-v$($manifest.runtimeVersion)" --repo "${{ github.repository }}" --dir .runtime/bundle

      - name: Verify locked runtime download
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-runtime-bundle.ps1 -BundleDir .runtime/bundle

      - name: Restore and verify runtime
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/restore-runtime.ps1 -BundleDir .runtime/bundle -DestinationDir .runtime/full
          Remove-Item -LiteralPath .runtime/bundle -Recurse -Force

      - name: Sign in to Azure
        if: env.ARHUB_SIGNING_PROVIDER == 'azure'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and verify signed installer
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows.ps1 -RuntimeDir .runtime/full -SigningProvider $env:ARHUB_SIGNING_PROVIDER -SkipTests

      - name: Reclaim build space and smoke-test installer
        shell: powershell
        run: |
          Remove-Item -LiteralPath .runtime/full -Recurse -Force
          Remove-Item -LiteralPath release/win-unpacked -Recurse -Force
          $installer = @(Get-ChildItem release -File -Filter 'ArHub-Setup-*.exe')
          if ($installer.Count -ne 1) { throw "Expected one installer, found $($installer.Count)." }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-test-installer.ps1 -InstallerPath $installer[0].FullName -PublisherName $env:ARHUB_PUBLISHER_NAME
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/create-checksums.ps1

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release/ArHub-Setup-*.exe
            release/ArHub-Setup-*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            release/sbom-*.cdx.json
            release/installer-smoke-report.json

      - name: Publish GitHub Release
        shell: powershell
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $notes = Join-Path 'docs/releases' "$tag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { throw "Release notes are missing: $notes" }
          $files = @(
            Get-ChildItem release -File | Where-Object {
              $_.Name -like 'ArHub-Setup-*' -or
              $_.Name -like '*.blockmap' -or
              $_.Name -eq 'latest.yml' -or
              $_.Name -eq 'SHA256SUMS.txt' -or
              $_.Name -like 'sbom-*.cdx.json' -or
              $_.Name -eq 'installer-smoke-report.json'
            } | Select-Object -ExpandProperty FullName
          )
          gh release create $tag @files --repo "${{ github.repository }}" --verify-tag --generate-notes --notes-file $notes --title "ArHub $tag" --latest
