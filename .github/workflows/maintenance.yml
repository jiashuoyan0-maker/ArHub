name: Scheduled Maintenance

on:
  schedule:
    - cron: '41 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: scheduled-maintenance
  cancel-in-progress: false

jobs:
  dependencies:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r backend/requirements.txt
          python -m pip install pip-audit

      - name: Run security and regression checks
        id: security
        continue-on-error: true
        shell: pwsh
        run: |
          $reportDir = Join-Path $env:RUNNER_TEMP 'arhub-maintenance'
          New-Item -ItemType Directory -Path $reportDir -Force | Out-Null
          $securityReport = Join-Path $reportDir 'maintenance-security-report.txt'
          $failed = $false
          npm audit --omit=dev --registry=https://registry.npmjs.org 2>&1 | Tee-Object -FilePath $securityReport
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          python -m pip_audit -r backend/requirements.txt 2>&1 | Tee-Object -FilePath $securityReport -Append
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          python -m pip_audit -r packaging/python-requirements.lock.txt --no-deps --disable-pip 2>&1 | Tee-Object -FilePath $securityReport -Append
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          npm run check:js 2>&1 | Tee-Object -FilePath $securityReport -Append
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          npm run check:python 2>&1 | Tee-Object -FilePath $securityReport -Append
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          npm test 2>&1 | Tee-Object -FilePath $securityReport -Append
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          npm run audit:open-source 2>&1 | Tee-Object -FilePath $securityReport -Append
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          if ($failed) { throw 'One or more maintenance checks failed.' }

      - name: Check locked runtime versions
        id: runtime
        continue-on-error: true
        shell: pwsh
        run: |
          $reportDir = Join-Path $env:RUNNER_TEMP 'arhub-maintenance'
          New-Item -ItemType Directory -Path $reportDir -Force | Out-Null
          $runtimeLog = Join-Path $reportDir 'runtime-check-log.txt'
          $runtimeReport = Join-Path $reportDir 'runtime-update-report.md'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-runtime-updates.ps1 -ReportPath $runtimeReport 2>&1 | Tee-Object -FilePath $runtimeLog
          if ($LASTEXITCODE -ne 0) { throw 'Runtime version check failed.' }

      - name: Create or update runtime maintenance issue
        if: steps.runtime.outcome == 'success' && steps.runtime.outputs.updates == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runtimeReport = Join-Path $env:RUNNER_TEMP 'arhub-maintenance\runtime-update-report.md'
          ./scripts/sync-maintenance-issue.ps1 -Action Open `
            -Title 'Runtime dependency updates are available' `
            -BodyFile $runtimeReport `
            -Label dependencies `
            -LabelColor 0366d6 `
            -LabelDescription 'Dependency and runtime maintenance'

      - name: Close resolved runtime maintenance issue
        if: steps.runtime.outcome == 'success' && steps.runtime.outputs.updates != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/sync-maintenance-issue.ps1 -Action Close `
            -Title 'Runtime dependency updates are available' `
            -ResolvedComment 'The weekly runtime check no longer finds pending updates.'

      - name: Prepare failed-maintenance report
        if: always() && (steps.security.outcome == 'failure' || steps.runtime.outcome == 'failure')
        shell: pwsh
        run: |
          $content = "# Scheduled maintenance failure`n`n"
          $reportDir = Join-Path $env:RUNNER_TEMP 'arhub-maintenance'
          foreach ($name in @('maintenance-security-report.txt', 'runtime-check-log.txt')) {
            $report = Join-Path $reportDir $name
            if (Test-Path -LiteralPath $report) {
              $content += "## $name`n`n"
              $content += [System.IO.File]::ReadAllText((Resolve-Path -LiteralPath $report))
              $content += "`n`n"
            }
          }
          if ($content.Length -gt 60000) { $content = $content.Substring(0, 60000) + "`n`n[report truncated]" }
          [System.IO.File]::WriteAllText((Join-Path $reportDir 'maintenance-failure-report.md'), $content, (New-Object System.Text.UTF8Encoding($false)))

      - name: Create or update failed-maintenance issue
        if: always() && (steps.security.outcome == 'failure' || steps.runtime.outcome == 'failure')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $failureReport = Join-Path $env:RUNNER_TEMP 'arhub-maintenance\maintenance-failure-report.md'
          ./scripts/sync-maintenance-issue.ps1 -Action Open `
            -Title 'Scheduled maintenance checks are failing' `
            -BodyFile $failureReport `
            -Label maintenance `
            -LabelColor d73a4a `
            -LabelDescription 'Automated maintenance needs attention'

      - name: Close resolved failed-maintenance issue
        if: steps.security.outcome == 'success' && steps.runtime.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/sync-maintenance-issue.ps1 -Action Close `
            -Title 'Scheduled maintenance checks are failing' `
            -ResolvedComment 'All scheduled security and regression checks pass again.'

      - name: Fail when maintenance checks failed
        if: steps.security.outcome == 'failure' || steps.runtime.outcome == 'failure'
        run: exit 1
