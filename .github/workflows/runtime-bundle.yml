name: Runtime Bundle

on:
  workflow_dispatch:

concurrency:
  group: runtime-bundle
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  bundle:
    runs-on: [self-hosted, Windows, X64, arhub-runtime]
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      ARHUB_RUNTIME_DIR: ${{ vars.ARHUB_RUNTIME_DIR }}
      ARHUB_RUNTIME_BUNDLE_CACHE: ${{ vars.ARHUB_RUNTIME_BUNDLE_CACHE }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: Install packaging dependencies
        run: npm ci

      - name: Build locked runtime bundle
        shell: powershell
        run: |
          if (-not $env:ARHUB_RUNTIME_DIR) { throw 'Repository variable ARHUB_RUNTIME_DIR is required on the runtime builder.' }
          New-Item -ItemType Directory -Path runtime-output -Force | Out-Null
          $arguments = @(
            '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'scripts/package-runtime.ps1',
            '-RuntimeDir', $env:ARHUB_RUNTIME_DIR, '-OutputDir', 'runtime-output'
          )
          if ($env:ARHUB_RUNTIME_BUNDLE_CACHE) {
            $arguments += @('-ArchiveSeedDir', $env:ARHUB_RUNTIME_BUNDLE_CACHE, '-ReuseExistingArchives')
          }
          powershell @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Runtime bundle packaging failed.' }

      - name: Verify committed bundle manifest
        shell: powershell
        run: |
          $expected = Get-Content packaging/runtime-bundle.json -Encoding utf8 | ConvertFrom-Json | ConvertTo-Json -Depth 10
          $actual = Get-Content runtime-output/runtime-bundle.json -Encoding utf8 | ConvertFrom-Json | ConvertTo-Json -Depth 10
          if ($expected -ne $actual) { throw 'runtime-bundle.json changed. Export and review the new lock before publishing.' }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-runtime-bundle.ps1 -BundleDir runtime-output

      - name: Attest runtime archives
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: runtime-output/*

      - name: Publish runtime release assets
        shell: powershell
        run: |
          $manifest = Get-Content packaging/runtime-manifest.json -Encoding utf8 | ConvertFrom-Json
          $tag = "runtime-v$($manifest.runtimeVersion)"
          $releaseList = gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,isDraft,isPrerelease
          if ($LASTEXITCODE -ne 0) { throw 'Unable to list existing releases.' }
          $release = @($releaseList | ConvertFrom-Json | Where-Object { $_.tagName -ceq $tag }) | Select-Object -First 1
          if ($release) {
            if (-not $release.isDraft) { throw "Runtime release $tag is already published and immutable." }
          } else {
            gh release create $tag --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "ArHub Runtime $($manifest.runtimeVersion)" --notes "Locked Windows x64 runtime used by ArHub releases. This prerelease is an internal build input, not an application update." --draft --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw "Unable to create runtime release $tag." }
          }
          $assets = @(Get-ChildItem runtime-output -File | Select-Object -ExpandProperty FullName)
          gh release upload $tag @assets --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to upload runtime release assets for $tag." }
          gh release edit $tag --repo "${{ github.repository }}" --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish runtime release $tag." }
