name: Auto Lite Candidate

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-lite-candidate
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-candidate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha)
    runs-on: [self-hosted, Windows, X64, arhub-release]
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      ARHUB_RUNTIME_DIR: ${{ vars.ARHUB_RUNTIME_DIR }}

    steps:
      - name: Check out verified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      - name: Prepare isolated beta version
        id: version
        shell: powershell
        run: |
          $current = [string](Get-Content package.json -Encoding utf8 | ConvertFrom-Json).version
          if ($current -notmatch '^(\d+)\.(\d+)\.(\d+)(?:-.+)?$') { throw "Unsupported package version: $current" }
          $version = '{0}.{1}.{2}-beta.{3}.{4}' -f $Matches[1], $Matches[2], ([int]$Matches[3] + 1), '${{ github.run_number }}', '${{ github.run_attempt }}'
          npm version $version --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) { throw 'Failed to set candidate version.' }
          $tag = "v$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install packaging dependencies
        run: npm ci

      - name: Build verified Lite candidate
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows.ps1
          -RuntimeDir $env:ARHUB_RUNTIME_DIR -RuntimeProfile lite -UnsignedRelease -SkipTests

      - name: Remove unpacked staging files
        shell: powershell
        run: Remove-Item -LiteralPath release/win-unpacked -Recurse -Force -ErrorAction SilentlyContinue

      - name: Attest candidate assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release/ArHub-Setup-*.exe
            release/ArHub-Setup-*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            release/sbom-*.cdx.json

      - name: Publish beta Release without replacing Stable
        shell: powershell
        run: |
          $files = @(
            Get-ChildItem release -File | Where-Object {
              $_.Name -like 'ArHub-Setup-*' -or
              $_.Name -like '*.blockmap' -or
              $_.Name -eq 'latest.yml' -or
              $_.Name -eq 'SHA256SUMS.txt' -or
              $_.Name -like 'sbom-*.cdx.json'
            } | Select-Object -ExpandProperty FullName
          )
          gh release create '${{ steps.version.outputs.tag }}' @files `
            --repo '${{ github.repository }}' `
            --target '${{ github.event.workflow_run.head_sha || github.sha }}' `
            --prerelease `
            --generate-notes `
            --title 'ArHub v${{ steps.version.outputs.version }} Lite candidate'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish the Lite candidate Release.' }
