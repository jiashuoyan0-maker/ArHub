name: Windows Lite Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    if: github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-beta.')
    runs-on: [self-hosted, Windows, X64, arhub-release]
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      ARHUB_RUNTIME_DIR: ${{ vars.ARHUB_RUNTIME_DIR }}
      ARHUB_RUNTIME_BUNDLE_CACHE: ${{ vars.ARHUB_RUNTIME_BUNDLE_CACHE }}
      ARHUB_RELEASE_ASSET_CACHE: ${{ vars.ARHUB_RELEASE_ASSET_CACHE }}

    steps:
      - name: Resolve release tag
        id: release
        shell: powershell
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+([+-].+)?$') { throw "Invalid release tag: $tag" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify tag matches package version
        shell: powershell
        run: |
          $version = (Get-Content package.json -Encoding utf8 | ConvertFrom-Json).version
          if ('${{ steps.release.outputs.tag }}' -ne "v$version") { throw "Tag must be v$version" }

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r backend/requirements.txt
          python -m pip install pip-audit

      - name: Run quality gates
        run: |
          npm audit --omit=dev --registry=https://registry.npmjs.org
          python -m pip_audit -r backend/requirements.txt
          python -m pip_audit -r packaging/python-requirements.lock.txt --no-deps --disable-pip
          npm run check:js
          npm run check:python
          npm test
          npm run audit:open-source

      - name: Detect reusable release artifacts
        id: existing
        shell: powershell
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $releases = @(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName | ConvertFrom-Json)
          $exists = @($releases | Where-Object { $_.tagName -eq $tag }).Count -eq 1
          $reuse = $false
          if ($exists) {
            $release = gh release view $tag --repo "${{ github.repository }}" --json assets | ConvertFrom-Json
            $installers = @($release.assets | Where-Object { $_.name -like 'ArHub-Setup-*.exe' -and $_.name -notlike '*.blockmap' })
            $blockmaps = @($release.assets | Where-Object { $_.name -like 'ArHub-Setup-*.exe.blockmap' })
            $reuse = $installers.Count -eq 1 -and $blockmaps.Count -eq 1
          }
          "exists=$($exists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "reuse=$($reuse.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download and verify reusable release artifacts
        if: steps.existing.outputs.reuse == 'true'
        shell: powershell
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $release = gh release view $tag --repo "${{ github.repository }}" --json assets | ConvertFrom-Json
          $expected = @($release.assets | Where-Object { $_.name -like 'ArHub-Setup-*.exe' -or $_.name -like 'ArHub-Setup-*.exe.blockmap' })
          if ($expected.Count -ne 2) { throw "Expected installer and blockmap assets, found $($expected.Count)." }
          $cache = [string]$env:ARHUB_RELEASE_ASSET_CACHE
          $cacheReady = -not [string]::IsNullOrWhiteSpace($cache) -and (Test-Path -LiteralPath $cache -PathType Container)
          if ($cacheReady) {
            foreach ($asset in $expected) {
              $source = Join-Path $cache $asset.name
              if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
                $cacheReady = $false
                break
              }
              $item = Get-Item -LiteralPath $source
              $digest = 'sha256:' + (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($digest -ne $asset.digest -or $item.Length -ne [int64]$asset.size) {
                $cacheReady = $false
                break
              }
            }
          }
          if ($cacheReady) {
            foreach ($asset in $expected) {
              Copy-Item -LiteralPath (Join-Path $cache $asset.name) -Destination (Join-Path 'release' $asset.name) -Force
            }
            Write-Host "Reused verified release assets from $cache"
          } else {
            gh release download $tag --repo "${{ github.repository }}" --pattern 'ArHub-Setup-*.exe' --pattern 'ArHub-Setup-*.exe.blockmap' --dir release
            if ($LASTEXITCODE -ne 0) { throw 'Failed to download reusable release assets.' }
          }
          $files = @(Get-ChildItem release -File | Where-Object { $_.Name -like 'ArHub-Setup-*.exe' -or $_.Name -like 'ArHub-Setup-*.exe.blockmap' })
          if ($files.Count -ne 2) { throw "Expected installer and blockmap, found $($files.Count) files." }
          foreach ($file in $files) {
            $asset = @($release.assets | Where-Object { $_.name -eq $file.Name })
            if ($asset.Count -ne 1) { throw "Release asset metadata is missing or duplicated: $($file.Name)" }
            $digest = 'sha256:' + (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset[0].digest -ne $digest) { throw "Release asset digest mismatch: $($file.Name)" }
            if ([int64]$asset[0].size -ne $file.Length) { throw "Release asset size mismatch: $($file.Name)" }
          }

      - name: Resolve verified Lite runtime
        id: runtime
        shell: powershell
        run: |
          $runtime = [string]$env:ARHUB_RUNTIME_DIR
          if ([string]::IsNullOrWhiteSpace($runtime) -or -not (Test-Path -LiteralPath $runtime -PathType Container)) {
            throw 'Repository variable ARHUB_RUNTIME_DIR must point to a prepared Lite-compatible runtime.'
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/assert-lite-runtime.ps1 -RuntimeDir $runtime -AllowOptionalComponents -EnforceLock
          if ($LASTEXITCODE -ne 0) { throw 'Lite runtime validation failed.' }
          $runtime = (Resolve-Path -LiteralPath $runtime).Path
          "ARHUB_EFFECTIVE_RUNTIME_DIR=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and verify unsigned installer
        if: steps.existing.outputs.reuse != 'true'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows.ps1 -RuntimeDir $env:ARHUB_EFFECTIVE_RUNTIME_DIR -RuntimeProfile lite -UnsignedRelease -SkipTests

      - name: Prepare metadata for reused installer
        if: steps.existing.outputs.reuse == 'true'
        shell: powershell
        run: |
          $installer = @(Get-ChildItem release -File -Filter 'ArHub-Setup-*.exe')
          if ($installer.Count -ne 1) { throw "Expected one installer, found $($installer.Count)." }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer[0].FullName
          if ($signature.Status -ne 'NotSigned') { throw "Official installer must be NotSigned: $($signature.Status)" }
          $version = (Get-Content package.json -Encoding utf8 | ConvertFrom-Json).version
          $sha512 = [System.Security.Cryptography.SHA512]::Create()
          $stream = [System.IO.File]::OpenRead($installer[0].FullName)
          try {
            $encodedHash = [Convert]::ToBase64String($sha512.ComputeHash($stream))
          } finally {
            $stream.Dispose()
            $sha512.Dispose()
          }
          $releaseInfo = gh release view '${{ steps.release.outputs.tag }}' --repo "${{ github.repository }}" --json publishedAt | ConvertFrom-Json
          $releaseDate = ([DateTimeOffset]$releaseInfo.publishedAt).UtcDateTime.ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          $lines = @(
            "version: $version",
            'files:',
            "  - url: $($installer[0].Name)",
            "    sha512: $encodedHash",
            "    size: $($installer[0].Length)",
            "path: $($installer[0].Name)",
            "sha512: $encodedHash",
            "releaseDate: '$releaseDate'"
          )
          [System.IO.File]::WriteAllLines((Join-Path 'release' 'latest.yml'), $lines, (New-Object System.Text.UTF8Encoding($false)))
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/generate-sbom.ps1 -RuntimeDir $env:ARHUB_EFFECTIVE_RUNTIME_DIR

      - name: Reclaim build space and smoke-test installer
        shell: powershell
        run: |
          Remove-Item -LiteralPath release/win-unpacked -Recurse -Force -ErrorAction SilentlyContinue
          $installer = @(Get-ChildItem release -File -Filter 'ArHub-Setup-*.exe')
          if ($installer.Count -ne 1) { throw "Expected one installer, found $($installer.Count)." }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-test-installer.ps1 -InstallerPath $installer[0].FullName -RequireUnsigned
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/create-checksums.ps1

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release/ArHub-Setup-*.exe
            release/ArHub-Setup-*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            release/sbom-*.cdx.json
            release/installer-smoke-report.json

      - name: Publish GitHub Release
        shell: powershell
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $notes = Join-Path 'docs/releases' "$tag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { throw "Release notes are missing: $notes" }
          $files = @(
            Get-ChildItem release -File | Where-Object {
              $_.Name -like 'ArHub-Setup-*' -or
              $_.Name -like '*.blockmap' -or
              $_.Name -eq 'latest.yml' -or
              $_.Name -eq 'SHA256SUMS.txt' -or
              $_.Name -like 'sbom-*.cdx.json' -or
              $_.Name -eq 'installer-smoke-report.json'
            } | Select-Object -ExpandProperty FullName
          )
          $releases = @(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName | ConvertFrom-Json)
          $exists = @($releases | Where-Object { $_.tagName -eq $tag }).Count -eq 1
          if (-not $exists) {
            gh release create $tag @files --repo "${{ github.repository }}" --verify-tag --generate-notes --notes-file $notes --title "ArHub $tag" --latest
            exit $LASTEXITCODE
          }
          $release = gh release view $tag --repo "${{ github.repository }}" --json assets | ConvertFrom-Json
          foreach ($path in $files) {
            $file = Get-Item -LiteralPath $path
            $digest = 'sha256:' + (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $asset = @($release.assets | Where-Object { $_.name -eq $file.Name })
            if ($asset.Count -eq 1 -and $asset[0].digest -eq $digest -and [int64]$asset[0].size -eq $file.Length) {
              Write-Host "Release asset already matches: $($file.Name)"
              continue
            }
            gh release upload $tag $file.FullName --repo "${{ github.repository }}" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload release asset: $($file.Name)" }
          }
          gh release edit $tag --repo "${{ github.repository }}" --notes-file $notes --title "ArHub $tag" --latest
